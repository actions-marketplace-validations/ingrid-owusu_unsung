[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unsung-card"
version = "0.4.0"
description = "A GitHub profile card for the open-source work that doesn't show up on your contribution graph: reviews given, and PRs/issues to repos you don't own."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ingrid Owusu" }]
keywords = ["github", "profile-readme", "svg", "badge", "code-review", "open-source", "github-action"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ingrid-owusu/unsung"
Repository = "https://github.com/ingrid-owusu/unsung"
Issues = "https://github.com/ingrid-owusu/unsung/issues"

[project.scripts]
unsung = "unsung.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
